name: Mthreads-Build-And-Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mthreads-build-and-test:
    runs-on: mthreads
    steps:
      - name: Setup environment
        shell: bash
        run: |
          source ~/env.sh
          env | grep -E '^(http_proxy|https_proxy|all_proxy|no_proxy)=' >> $GITHUB_ENV || true

      - name: Checkout code (attempt 1)
        id: checkout1
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        continue-on-error: true

      - name: Sleep before checkout2
        if: steps.checkout1.outcome == 'failure'
        run: |
          echo "First checkout attempt failed. Sleeping for 120 seconds before retry..."
          sleep 120

      - name: Checkout code (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        continue-on-error: true

      - name: Sleep before final checkout
        if: steps.checkout1.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        run: |
          echo "Second checkout attempt failed. Sleeping for 180 seconds before final retry..."
          sleep 180

      - name: Checkout code (final attempt)
        if: steps.checkout1.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify checkout success
        if: success()
        run: echo "Checkout completed successfully"

      - name: Check if only docs files changed
        id: check_files
        uses: ./.github/actions/check-docs-only

      - name: FlagTree Build on Mthreads
        if: steps.check_files.outputs.only_docs_changed != 'true'
        shell: bash
        run: |
          set -x
          pip uninstall -y triton
          export FLAGTREE_BACKEND=mthreads
          MAX_JOBS=32 python3 -m pip install . --no-build-isolation

      - name: FlagTree Test on Mthreads
        if: steps.check_files.outputs.only_docs_changed != 'true'
        shell: bash
        run: |
          set -x
          TRITON_OPT=$(python3 - <<'PY'
          import os
          from python.build_helpers import get_cmake_dir

          def env_flag(name, default=""):
              return os.getenv(name, default).upper() in {"ON", "1", "YES", "TRUE", "Y"}

          if env_flag("DEBUG"):
              config = "Debug"
          elif env_flag("REL_WITH_DEB_INFO"):
              config = "RelWithDebInfo"
          else:
              config = "Release"
          print(get_cmake_dir() / config / "bin" / "triton-opt")
          PY
          )
          if [ ! -x "$TRITON_OPT" ]; then
            echo "triton-opt was not built at: $TRITON_OPT" >&2
            exit 1
          fi
          "$TRITON_OPT" --pass-pipeline='builtin.module(convert-triton-to-tritongpu{target="cuda:CC" num-warps=4 threads-per-warp=32 num-ctas=1})' ./python/tutorials/hints/01/base/add_kernel.ttir
          "$TRITON_OPT" --convert-ub-to-llvm ./python/tutorials/hints/01/base/add_kernel.ttgir
          MUSA_VISIBLE_DEVICES=7 python3 -m pytest -s third_party/mthreads/python/test/unit

name: Code-Format-Check

on:
  push:
    branches: [ "main", "triton_v3.2.x", "triton_v3.3.x", "triton_v3.4.x", "triton_v3.5.x"]
  pull_request:
    branches: [ "main", "triton_v3.2.x", "triton_v3.3.x", "triton_v3.4.x", "triton_v3.5.x"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.BOT_PAT_TOKEN || github.token }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install pre-commit
      run: python -m pip install pre-commit
    - name: Collect files for pre-commit
      id: changed_files
      shell: bash
      run: |
        set -euo pipefail

        files_path="$RUNNER_TEMP/pre-commit-files.txt"

        if [ "${{ github.event_name }}" == "pull_request" ]; then
          git diff --name-only --diff-filter=ACMRTUXB "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "$files_path"
        elif [ "${{ github.event_name }}" == "push" ]; then
          before_sha="${{ github.event.before }}"
          head_sha="${{ github.sha }}"
          if [[ "$before_sha" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-only --diff-filter=ACMRTUXB -r "$head_sha" > "$files_path"
          else
            git diff --name-only --diff-filter=ACMRTUXB "$before_sha" "$head_sha" > "$files_path"
          fi
        else
          echo "Unsupported event for diff-scoped pre-commit: ${{ github.event_name }}" >&2
          exit 1
        fi

        if [ -s "$files_path" ]; then
          echo "has_files=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_files=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Run pre-commit
      if: steps.changed_files.outputs.has_files == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t files < "$RUNNER_TEMP/pre-commit-files.txt"
        pre-commit run --show-diff-on-failure --color=always --files "${files[@]}"
